<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">BestGames</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="informaciok.html">Információk</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="szerkesztok.html">Szerkesztők</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Kezdőlap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="text-center mb-4">Játékok</h2>
        <div class="row">
            <!-- BlackJack Card -->
            <div class="col-md-6 mb-4">
                <div class="game-card" id="blackjackCard">
                    <img src="index_kepek/blackjack_kep.png" alt="BlackJack">
                    <div class="p-3">
                        <h3>BlackJack</h3>
                        <p id="blackjackDescription">
                            A játék célja, hogy a lapjaid összege 21 legyen minél kevesebb lapból.
                        </p>
                    </div>
                </div>
            </div>

            <!-- PingPong Card -->
            <div class="col-md-6 mb-4">
                <div class="game-card" onclick="window.location.href='pingpong.html'">
                    <img src="index_kepek/pingponguto.png" alt="PingPong">
                    <div class="p-3">
                        <h3>PingPong</h3>
                        <p>
                            PingPong, a játék célja hogy a labdát az ellenfél térfelér üsdd, úgy hogy ne tudja visszaütni.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Age Verification Modal -->
    <div class="age-modal" id="ageModal">
        <div class="bg-white p-5 rounded text-center">
            <h2>Elmúltál már 18?</h2>
            <div class="mt-3">
                <button id="yesBtn" class="btn btn-success me-3">Igen</button>
                <button id="noBtn" class="btn btn-danger">Nem</button>
            </div>
        </div>
    </div>

    <script>
        const ageModal = document.getElementById('ageModal');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const blackjackCard = document.getElementById('blackjackCard');
        const blackjackDescription = document.getElementById('blackjackDescription');

        // Blackjack card click handler
        blackjackCard.addEventListener('click', () => {
            // Show age verification modal
            ageModal.classList.add('active');
        });

        // Handle "Igen" button click
        yesBtn.addEventListener('click', () => {
            ageModal.classList.remove('active');
            // Redirect to Blackjack page
            window.location.href = 'blackjack.html';
        });

        // Handle "Nem" button click
        noBtn.addEventListener('click', () => {
            ageModal.classList.remove('active');
            blackjackCard.classList.add('disabled-card');
            blackjackDescription.textContent = "Ezzel a játékkal nem játszhatsz.";
        });

    </script>
    <footer class="text-center py-4 mt-4">
        <p>&copy; 2025 BestGames</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
